name: DDF quality gates

on:
  pull_request:
  push:
    branches: [codex/ddf-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:verify
      - run: npm run check
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
