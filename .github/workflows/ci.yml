name: DDF quality gates

on:
  pull_request:
  push:
    branches: [main, codex/ddf-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-supplier-page.mjs
      - run: docker build -f docker/supplier-browser.Dockerfile -t ddf-supplier-browser .
      - run: docker run --rm --entrypoint node ddf-supplier-browser scripts/test-supplier-page.mjs
      - run: npm run db:verify
      - run: npm run check
      - run: npm run test:e2e
      - run: docker run --rm --entrypoint node ddf-supplier-browser scripts/test-variant-interface.mjs
      - run: npm audit --omit=dev --audit-level=high
      - name: Preserve preview-ready build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ddf-preview-${{ github.event.pull_request.number }}
          path: .next
          retention-days: 7

